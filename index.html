<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>릴레이 미션 심판용</title>
<style>
/* ── 심판용. 흰 바탕 · 검은 글씨 · 큰 글씨. 색은 경고와 완화 표시에만 쓴다. ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:#fff;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px}
.hide{display:none!important}

/* 헤더 */
.top{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:2px solid #111}
.top .blk{font-size:16px;font-weight:800}
.top .team{margin-left:auto;font-size:15px;color:#555}
.undo{
  touch-action:manipulation;
  margin-left:8px;border:1px solid #bbb;background:#fff;color:#555;
  font-size:13px;padding:6px 10px;border-radius:6px;font-family:inherit;
}
.undo:disabled{opacity:.3}

/* 회차 점 — 이 미션을 몇 번째 도전 중인가 */
.dots{display:flex;gap:9px;align-items:center;padding:14px 0 2px;flex-wrap:wrap}
.dots .lab{font-size:14px;font-weight:800;color:#666;margin-right:2px}
.dots .d{width:20px;height:20px;border-radius:50%;border:3px solid #bbb;background:#fff}
.dots .d.t1{border-color:#E09B00}
.dots .d.t2{border-color:#C62A14}
.dots .d.on{background:#999;border-color:#999}
.dots .d.t1.on{background:#E09B00;border-color:#E09B00}
.dots .d.t2.on{background:#C62A14;border-color:#C62A14}
.dots .d.now{box-shadow:0 0 0 4px #e8e8e8}
.dots .n{margin-left:4px;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.dots .n.t1{color:#9A6A00}
.dots .n.t2{color:#C62A14}

/* 미션 머리 */
.mnum{font-size:14px;font-weight:800;letter-spacing:.08em;color:#666;margin-top:18px}
.mname{font-size:30px;font-weight:800;line-height:1.2;margin:2px 0 0}
.mppl{font-size:16px;color:#555;margin-top:4px}

.badge{
  display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;
  font-size:14px;font-weight:800;border:2px solid #111;background:#fff;color:#111;
}
.badge{border-color:#999;color:#555}
.badge.t1{border-color:#E09B00;background:#FFF5DC;color:#8A5E00}
.badge.t2{border-color:#C62A14;background:#FDE9E5;color:#A32310}

.cond{font-size:20px;font-weight:700;margin-top:12px;line-height:1.45}

/* 브리핑 멘트 */
.script{
  margin-top:16px;padding:18px 16px;border:3px solid #111;border-radius:10px;
  font-size:20px;line-height:1.7;font-weight:600;
}
.meta{margin-top:14px;font-size:16px;color:#333}
.meta b{font-weight:800}

/* 타이머 */
.timer{
  font-size:76px;font-weight:800;line-height:1;text-align:center;
  margin:22px 0 6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.timer.warn{color:#c62a14}
.timer.none{font-size:30px;color:#777;font-weight:700}

/* 남은 도전 */
.tries{text-align:center;margin-top:14px}
.tries .lab{font-size:15px;color:#555;font-weight:700}
.tries .pips{display:flex;gap:12px;justify-content:center;margin:10px 0 6px}
.tries .p{width:26px;height:26px;border-radius:50%;border:3px solid #111;background:#111}
.tries .p.used{background:#fff;border-color:#bbb}
.tries .n{font-size:26px;font-weight:800}

/* 경고 */
.alert{
  margin-top:18px;padding:16px;border-radius:10px;
  background:#c62a14;color:#fff;text-align:center;
}
.alert .t{font-size:24px;font-weight:800}
.alert .s{font-size:18px;font-weight:700;margin-top:4px}

/* 버튼 */
.btns{margin-top:22px;display:flex;flex-direction:column;gap:12px}
button.big{
  touch-action:manipulation;
  width:100%;min-height:76px;border-radius:10px;font-family:inherit;
  font-size:26px;font-weight:800;border:3px solid #111;background:#111;color:#fff;
  cursor:pointer;
}
button.big.ghost{background:#fff;color:#111}
button.big:active{transform:translateY(1px)}

.ready{margin-top:12px;font-size:16px;color:#8A5E00;text-align:center;font-weight:700}
.foot{margin-top:18px;font-size:15px;color:#555;text-align:center;font-weight:600}

/* 시작/종료 화면 */
h1{font-size:28px;font-weight:800;margin:10px 0 6px}
.lead{color:#555;font-size:16px;margin:0 0 18px}
label{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
input[type=text]{
  width:100%;min-height:58px;font-size:20px;font-family:inherit;
  border:2px solid #111;border-radius:8px;padding:10px 12px;background:#fff;color:#111;
}
.sum{border:2px solid #111;border-radius:10px;margin-top:16px}
.sum .r{display:flex;padding:11px 14px;border-top:1px solid #ddd;font-size:17px}
.sum .r:first-child{border-top:0}
.sum .r b{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

/* 실패 오버레이 */
.ov{position:fixed;inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.ov .inner{max-width:480px;width:100%;text-align:center}
.ov .hd{font-size:34px;font-weight:800;color:#c62a14}
.ov .to{font-size:40px;font-weight:800;margin:18px 0 6px;line-height:1.25}
.ov .sub{font-size:19px;color:#333;font-weight:600}

/* 완화 안내 (실패 오버레이 안) */
.ease{
  margin-top:22px;padding:16px;border:3px solid #E09B00;border-radius:10px;
  color:#8A5E00;text-align:left;
}
.ease.t2{border-color:#C62A14;color:#A32310}
.ease .h{font-size:18px;font-weight:800}
.ease .c{font-size:21px;font-weight:800;color:#111;margin-top:6px;line-height:1.4}

/* 완화 토스트 */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:60;
  max-width:92vw;background:#111;color:#fff;padding:14px 18px;border-radius:10px;
  font-size:17px;font-weight:700;text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

<!-- ══════════ 시작 ══════════ -->
<section id="s-start">
  <h1>릴레이 미션 심판용</h1>
  <p class="lead">한 팀에 한 대. 미션 01–08을 순서대로 진행합니다.</p>
  <label for="team">팀 이름 (선택)</label>
  <input type="text" id="team" placeholder="예: A팀" autocomplete="off">
  <div class="btns">
    <button class="big hide" id="btn-resume">이어서 하기</button>
    <button class="big" id="btn-new">시작</button>
  </div>
</section>

<!-- ══════════ 브리핑 ══════════ -->
<section id="s-brief" class="hide">
  <div class="top"><span class="blk" id="b-blk"></span><span class="team" id="b-team"></span>
    <button class="undo" id="b-undo">되돌리기</button></div>
  <div class="dots" id="b-dots"></div>
  <div class="mnum" id="b-num"></div>
  <div class="mname" id="b-name"></div>
  <div class="mppl" id="b-ppl"></div>
  <div><span class="badge" id="b-badge"></span></div>
  <div class="cond" id="b-cond"></div>
  <div class="script" id="b-script"></div>
  <div class="meta" id="b-meta"></div>
  <div class="btns"><button class="big" id="b-start">시작 — 타이머 ON</button></div>
  <div class="foot" id="b-foot"></div>
</section>

<!-- ══════════ 진행 ══════════ -->
<section id="s-run" class="hide">
  <div class="top"><span class="blk" id="r-blk"></span><span class="team" id="r-team"></span>
    <button class="undo" id="r-undo">되돌리기</button></div>
  <div class="dots" id="r-dots"></div>
  <div class="mnum" id="r-num"></div>
  <div class="mname" id="r-name"></div>
  <div><span class="badge" id="r-badge"></span></div>
  <div class="cond" id="r-cond"></div>
  <div class="timer" id="r-timer"></div>
  <div class="tries hide" id="r-tries">
    <div class="lab">남은 도전</div>
    <div class="pips" id="r-pips"></div>
    <div class="n" id="r-triesN"></div>
  </div>
  <div class="alert hide" id="r-alert"><div class="t" id="r-alert-t"></div><div class="s" id="r-alert-s"></div></div>
  <div class="btns">
    <button class="big" id="r-go">이번 도전 시작</button>
    <button class="big" id="r-pass">통 과</button>
    <button class="big ghost" id="r-fail"></button>
  </div>
  <div class="ready hide" id="r-ready">선수가 출발 지점에 서면 누르세요</div>
  <div class="foot" id="r-foot"></div>
</section>

<!-- ══════════ 종료 ══════════ -->
<section id="s-done" class="hide">
  <h1>완주</h1>
  <p class="lead" id="d-lead"></p>
  <div class="sum" id="d-sum"></div>
  <div class="btns"><button class="big ghost" id="d-reset">처음으로</button></div>
  <div class="foot">09번 초성 물건 찾아오기는 MC가 따로 진행합니다.</div>
</section>

</div>

<!-- 실패 오버레이 -->
<div class="ov hide" id="ov">
  <div class="inner">
    <div class="hd">↩ 실패</div>
    <div class="to" id="ov-to"></div>
    <div class="sub" id="ov-sub"></div>
    <div class="ease hide" id="ov-ease"></div>
    <div class="btns"><button class="big" id="ov-ok">확인</button></div>
  </div>
</div>

<script>
/* ══════════════════ 미션 데이터 ══════════════════
   대회 전날 숫자가 바뀌면 여기만 고치면 된다.
   t1 / t2 = 1차 / 2차 완화가 시작되는 회차
   limit   = [기본, 1차, 2차] 제한시간(초). null이면 제한시간 없음
   tries   = 1회차에 쓸 수 있는 도전 횟수 (없으면 시도 무제한)
   tryLimit= 도전 1회당 제한시간(초)                                  */
const MISSIONS = [
{ id:"01", name:"컵넣기", ppl:"6명 · 2인 1조 × 3조", blk:1, back:"01", t1:4, t2:6,
  limit:[90,90,90], tries:null, tryLimit:null,
  cond:["3걸음 간격 · 3개 조가 각각 1개씩 넣으면 통과",
        "던지는 사람 반걸음 앞으로 · 3개 조 각각 1개씩",
        "던지는 사람 반걸음 앞으로 · 2개 조만 성공해도 통과"],
  script:["컵넣기입니다! 2인 1조로 세 조가 동시에 던집니다. 3걸음 간격에서 세 조 모두 한 개씩 넣으면 통과! 90초 안에 못 하면 처음부터 다시입니다!",
          "컵넣기입니다! 던지는 분은 반걸음 앞으로 오세요! 세 조 모두 한 개씩 넣으면 통과, 90초입니다. 못 하면 처음부터 다시입니다!",
          "컵넣기입니다! 던지는 분 반걸음 앞으로! 이번엔 두 조만 성공해도 통과입니다. 90초, 시작하면 바로 던지세요!"] },

{ id:"02", name:"코끼리코·림보", ppl:"1명", blk:1, back:"01", t1:3, t2:5,
  limit:null, tries:2, tryLimit:30,
  cond:["코끼리코 10바퀴 → 3m 전진 → 림보(명치)",
        "코끼리코 5바퀴 → 3m 전진 → 림보(명치)",
        "코끼리코 5바퀴 → 3m 전진 → 림보(가슴)"],
  script:["코끼리코 림보입니다! 한 분이 두 번 도전할 수 있습니다. 코끼리코 열 바퀴 돌고 3미터 가서 명치 높이 림보를 통과하면 성공! 한 번에 30초입니다. 두 번 다 실패하면 컵넣기로 돌아갑니다!",
          "코끼리코 림보입니다! 이번엔 다섯 바퀴만 돌면 됩니다! 3미터 가서 명치 높이 림보 통과, 한 번에 30초. 두 번 다 실패하면 컵넣기로 돌아갑니다!",
          "코끼리코 림보입니다! 다섯 바퀴 돌고, 림보를 가슴 높이로 올려드립니다! 한 번에 30초, 두 번 도전. 실패하면 컵넣기로 돌아갑니다!"] },

{ id:"03", name:"제기차기", ppl:"3명", blk:1, back:"01", t1:2, t2:3,
  limit:null, tries:3, tryLimit:null,
  cond:["3명이 이어서 차 합산 20개",
        "3명이 이어서 차 합산 15개",
        "3명이 이어서 차 합산 10개"],
  script:["제기차기입니다! 세 분이 이어서 차서 합계 20개를 채우면 통과! 떨어뜨리면 다음 분이 이어서 찹니다. 세 번 도전할 수 있고, 세 번 안에 못 채우면 컵넣기로 돌아갑니다!",
          "제기차기입니다! 합계 15개로 줄여드립니다! 세 분이 이어서 차고, 세 번 도전할 수 있습니다. 못 채우면 컵넣기로 돌아갑니다!",
          "제기차기입니다! 합계 10개면 됩니다! 세 분이 이어서 차고 세 번 도전. 못 채우면 컵넣기로 돌아갑니다!"] },

{ id:"04", name:"쌩쌩이 줄넘기", ppl:"2명", blk:2, back:"04", t1:3, t2:6,
  limit:null, tries:2, tryLimit:null,
  cond:["쌩쌩이 누적 20개 · 걸리면 0으로 리셋",
        "쌩쌩이 누적 15개 · 걸리면 0으로 리셋",
        "쌩쌩이 누적 10개 · 걸리면 0으로 리셋"],
  script:["쌩쌩이 줄넘기입니다! 두 분이 차례로, 쌩쌩이 누적 20개를 채우면 통과! 일반 줄넘기를 섞어도 되지만 쉬면 안 됩니다. 줄이 걸리면 0부터 다시이고 다음 분으로 넘어갑니다. 두 번 안에 못 하면 처음부터 다시입니다!",
          "쌩쌩이 줄넘기입니다! 15개로 줄여드립니다! 일반 줄넘기 섞어도 되지만 쉬면 안 됩니다. 걸리면 0부터, 두 번 안에 못 하면 처음부터 다시입니다!",
          "쌩쌩이 줄넘기입니다! 10개면 됩니다! 걸리면 0부터 다시, 두 번 도전. 못 하면 처음부터 다시입니다!"] },

{ id:"05", name:"물병 세우기", ppl:"3명", blk:2, back:"04", t1:3, t2:5,
  limit:[60,60,90], tries:null, tryLimit:null,
  cond:["3명 동시 · 3명 모두 세워야 통과",
        "3명 동시 · 2명만 세우면 통과",
        "3명 동시 · 2명만 세우면 통과 (90초)"],
  script:["물병 세우기입니다! 세 분이 동시에 도전해서 세 분 모두 테이블 위에 세워야 통과! 60초입니다. 못 하면 쌩쌩이 줄넘기로 돌아갑니다!",
          "물병 세우기입니다! 두 분만 세우면 통과입니다! 60초, 시작합니다. 못 하면 쌩쌩이 줄넘기로 돌아갑니다!",
          "물병 세우기입니다! 두 분만 세우면 되고, 시간을 90초로 늘려드립니다! 못 하면 쌩쌩이 줄넘기로 돌아갑니다!"] },

{ id:"06", name:"공 빼기", ppl:"1명", blk:2, back:"04", t1:2, t2:3,
  limit:[60,60,90], tries:null, tryLimit:null,
  cond:["가방 속 공 20개 전부 빼내기",
        "가방 속 공 15개 빼내기",
        "가방 속 공 15개 빼내기 (90초)"],
  script:["공 빼기입니다! 가방을 메고 흔들어서 안에 든 공 20개를 전부 빼내면 통과! 60초입니다. 실패하면 쌩쌩이 줄넘기로 돌아갑니다!",
          "공 빼기입니다! 15개만 빼내면 됩니다! 60초, 실패하면 쌩쌩이 줄넘기로 돌아갑니다!",
          "공 빼기입니다! 15개만 빼내면 되고, 시간을 90초로 늘려드립니다! 실패하면 쌩쌩이 줄넘기로 돌아갑니다!"] },

{ id:"07", name:"휴지 굴리기", ppl:"1명", blk:3, back:"07", t1:3, t2:5,
  limit:[60,60,60], tries:null, tryLimit:null,
  cond:["4m 앞 1m × 1m 구역에 정지 · 휴지 3개",
        "출발선 1걸음 앞으로 · 구역은 그대로",
        "출발선 2걸음 앞으로 · 구역은 그대로"],
  script:["휴지 굴리기입니다! 4미터 앞 사각형 안에 휴지를 멈추게 하면 통과! 휴지 3개 드리고 60초입니다. 실패하면 처음부터 다시입니다!",
          "휴지 굴리기입니다! 출발선을 한 걸음 앞으로 옮겨드립니다! 사각형 안에 멈추면 통과, 60초입니다. 실패하면 처음부터 다시입니다!",
          "휴지 굴리기입니다! 출발선을 두 걸음 앞으로 옮겨드립니다! 60초 안에 사각형 안에 멈추면 통과입니다. 실패하면 처음부터 다시입니다!"] },

{ id:"08", name:"거위 링 던지기", ppl:"2명 · 던지기 1 · 받기 1", blk:3, back:"07", t1:2, t2:3,
  limit:[120,120,120], tries:null, tryLimit:null,
  cond:["5걸음 · 링 10개 전부 성공",
        "5걸음 · 8개 성공",
        "5걸음 · 5개 성공"],
  script:["거위 링 던지기입니다! 5걸음 거리에서 링 10개를 전부 거위 머리에 걸면 통과! 2분입니다. 실패하면 휴지 굴리기로 돌아갑니다!",
          "거위 링 던지기입니다! 8개만 성공하면 됩니다! 5걸음 거리, 2분입니다. 실패하면 휴지 굴리기로 돌아갑니다!",
          "거위 링 던지기입니다! 5개면 됩니다! 5걸음 거리에서 2분, 실패하면 휴지 굴리기로 돌아갑니다!"] },
];

const BLK_NAME = {1:"1구간 · 몸풀기", 2:"2구간 · 기술", 3:"3구간 · 피날레"};
const TIER_NAME = ["기본","1차 완화","2차 완화"];
const KEY = "relay-judge-v1";

/* ══════════════════ 상태 ══════════════════ */
let S = null;          // {team, idx, phase, att:{}, endsAt, triesLeft, startedAt}
let prev = null;       // 되돌리기용 직전 스냅샷
let tick = null;
let wake = null;

const $ = id => document.getElementById(id);
const M = () => MISSIONS[S.idx];
const tierOf = m => { const a = S.att[m.id]; return a < m.t1 ? 0 : a < m.t2 ? 1 : 2; };
const limitOf = m => m.limit ? m.limit[tierOf(m)] : null;
const missionById = id => MISSIONS.find(x => x.id === id);

/* 미션에 들어올 때마다 회차가 1 올라간다.
   뒤 미션이 실패해 되돌아온 경우에도 "다시 하는 것"이므로 회차가 올라간다. */
function enter(i){
  S.idx = i;
  const id = MISSIONS[i].id;
  S.att[id] = (S.att[id] || 0) + 1;
}

function backLabel(m){
  if (m.back === m.id) return "처음부터 다시";
  const b = missionById(m.back);
  return b.id + " " + b.name + "부터 다시";
}

/* ══════════════════ 저장 ══════════════════ */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function snap(){ prev = JSON.parse(JSON.stringify(S)); }

/* ══════════════════ 화면 전환 ══════════════════ */
function show(which){
  ["s-start","s-brief","s-run","s-done"].forEach(k => $(k).classList.toggle("hide", k !== which));
}

/* 현재 미션의 회차를 점으로. 점 색이 곧 그 회차의 적용 단계다.
   회색 = 기본 · 노랑 = 1차 완화 · 빨강 = 2차 완화 */
function dots(el, m){
  el.innerHTML = "";
  const att = S.att[m.id];
  const lab = document.createElement("span");
  lab.className = "lab"; lab.textContent = "회차";
  el.appendChild(lab);
  const N = 6;
  for (let i = 1; i <= N; i++){
    const t = i < m.t1 ? 0 : i < m.t2 ? 1 : 2;
    const d = document.createElement("div");
    d.className = "d" + (t ? " t" + t : "") + (i <= att ? " on" : "") + (i === att ? " now" : "");
    el.appendChild(d);
  }
  const n = document.createElement("span");
  const ct = tierOf(m);
  n.className = "n" + (ct ? " t" + ct : "");
  n.textContent = att + "회차";
  el.appendChild(n);
}

function badge(el, m){
  const t = tierOf(m);
  el.className = "badge" + (t === 1 ? " t1" : t === 2 ? " t2" : "");
  el.textContent = TIER_NAME[t];
}

function fmt(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

/* ── 소리 · 진동 ──────────────────────────────────────────
   아이폰 사파리는 navigator.vibrate를 지원하지 않는다.
   그래서 모든 신호를 소리로도 낸다. 오디오는 사용자가 버튼을
   누른 뒤에만 열리므로 armTry()에서 깨운다.
   ※ 아이폰은 무음 모드면 소리가 안 난다. 벨소리를 켜둘 것.      */
let AC = null;
function unlockAudio(){
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  }catch(e){}
}
function tone(freq, dur, at, vol, type, slideTo){
  if (!AC) return;
  try{
    const t = AC.currentTime + (at || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function vib(p){
  try{ return !!(navigator.vibrate && navigator.vibrate(p)); }catch(e){ return false; }
}
function beep(n){ for (let i = 0; i < n; i++) tone(880, 0.11, i * 0.18); }
function buzz(p){ if (!vib(p)) beep(Array.isArray(p) ? Math.ceil(p.length / 2) : 1); }

/* 30초 남음 — 가볍게 두 번 */
function cue30(){ vib([90,70,90]); tone(660, 0.14, 0); tone(660, 0.14, 0.22); }

/* 10초부터 1초까지 매초 — 마지막 3초는 높고 짧게 */
function cueTick(sec){
  if (sec <= 3){ vib(70); tone(1320, 0.09, 0, 0.3); }
  else { tone(880, 0.07, 0, 0.22); if (sec === 10) vib(120); }
}

/* 제한시간 초과 — 짧은 비프와 확실히 구분되는 알람. 떨어지는 소리 3번 */
function alarm(){
  unlockAudio();
  vib([300,120,300,120,300]);
  for (let i = 0; i < 3; i++) tone(1046, 0.30, i * 0.34, 0.32, "sawtooth", 466);
}

async function keepAwake(){
  try{ if ("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ wake = null; keepAwake(); }
});

/* ══════════════════ 브리핑 ══════════════════ */
function toBrief(){
  S.phase = "brief"; S.endsAt = null; stopTick(); save();
  const m = M(), t = tierOf(m);
  $("b-blk").textContent = BLK_NAME[m.blk];
  $("b-team").textContent = S.team || "";
  $("b-num").textContent = "MISSION " + m.id;
  $("b-name").textContent = m.name;
  $("b-ppl").textContent = m.ppl;
  badge($("b-badge"), m);
  $("b-cond").textContent = m.cond[t];
  $("b-script").textContent = "“" + m.script[t] + "”";
  const lim = limitOf(m);
  const bits = [];
  if (m.tries) bits.push("도전 " + m.tries + "번");
  if (m.tryLimit) bits.push("도전 1회당 " + m.tryLimit + "초");
  bits.push(lim ? "제한시간 " + lim + "초" : (m.tryLimit ? "" : "제한시간 없음"));
  $("b-meta").innerHTML = bits.filter(Boolean).map(x => "<b>" + x + "</b>").join(" &nbsp;·&nbsp; ");
  $("b-foot").textContent = "실패 시 → " + backLabel(m);
  dots($("b-dots"), m);
  $("b-undo").disabled = !prev;
  show("s-brief");
}

/* ══════════════════ 진행 ══════════════════ */
function startRun(){
  snap();
  const m = M();
  S.phase = "run";
  S.triesLeft = m.tries || null;
  S.armed = false;
  save(); keepAwake(); renderRun();
  armTry();                      // 브리핑의 [시작]이 곧 첫 도전 시작
}

/* 도전 1회를 실제로 시작한다. 타이머는 여기서부터 돈다. */
function armTry(){
  unlockAudio();
  const m = M();
  S.armed = true;
  S.endsAt = m.limit ? Date.now() + limitOf(m) * 1000
           : m.tryLimit ? Date.now() + m.tryLimit * 1000 : null;
  save(); keepAwake(); renderRun(); startTick();
}

function renderRun(){
  const m = M();
  $("r-blk").textContent = BLK_NAME[m.blk];
  $("r-team").textContent = S.team || "";
  $("r-num").textContent = "MISSION " + m.id;
  $("r-name").textContent = m.name;
  badge($("r-badge"), m);
  $("r-cond").textContent = m.cond[tierOf(m)];
  $("r-foot").textContent = "실패 시 → " + backLabel(m);
  $("r-fail").textContent = m.tries ? "도전 실패" : "실패";
  $("r-undo").disabled = !prev;

  if (m.tries){
    $("r-tries").classList.remove("hide");
    const pips = $("r-pips"); pips.innerHTML = "";
    for (let i = 0; i < m.tries; i++){
      const p = document.createElement("div");
      p.className = "p" + (i < m.tries - S.triesLeft ? " used" : "");
      pips.appendChild(p);
    }
    $("r-triesN").textContent = S.triesLeft + "번 남음";
  } else {
    $("r-tries").classList.add("hide");
  }
  const armed = S.armed !== false;
  $("r-go").classList.toggle("hide", armed);
  $("r-ready").classList.toggle("hide", armed);
  $("r-pass").classList.toggle("hide", !armed);
  $("r-fail").classList.toggle("hide", !armed);
  $("r-go").textContent = m.tries
    ? "도전 " + (m.tries - S.triesLeft + 1) + "번째 시작"
    : "시작";
  dots($("r-dots"), m);
  paint();
  show("s-run");
}

function paint(){
  const m = M(), el = $("r-timer"), al = $("r-alert");
  let warn = false, at = "", as = "";

  if (S.armed === false){
    const pre = m.limit ? limitOf(m) : m.tryLimit;
    el.className = "timer none";
    el.textContent = pre ? "대기 중 · " + pre + "초" : "제한시간 없음";
  } else if (S.endsAt){
    const left = S.endsAt - Date.now();
    el.className = "timer" + (left <= 10000 ? " warn" : "");
    el.textContent = fmt(left);
    if (left <= 10000){ warn = true; at = "⚠ " + Math.max(0, Math.ceil(left/1000)) + "초"; as = "실패하면 " + backLabel(m); }
  } else {
    el.className = "timer none";
    el.textContent = "제한시간 없음";
  }

  if (m.tries && S.triesLeft === 1){
    warn = true; at = "⚠ 마지막 도전입니다"; as = "실패하면 " + backLabel(m);
  }

  al.classList.toggle("hide", !warn);
  if (warn){ $("r-alert-t").textContent = at; $("r-alert-s").textContent = as; }
}

let lastSec = null;
function startTick(){
  stopTick();
  lastSec = null;
  tick = setInterval(() => {
    if (S.phase !== "run" || S.armed === false) return;
    paint();
    if (S.endsAt && Date.now() >= S.endsAt){
      const m = M();
      if (m.tryLimit){ alarm(); useTry(true); }   // 도전 1회 소진
      else { alarm(); doFail(); }                 // 회차 실패
    } else if (S.endsAt){
      const m2 = M();
      const total = m2.limit ? limitOf(m2) : m2.tryLimit;
      const sec = Math.ceil((S.endsAt - Date.now()) / 1000);
      if (sec !== lastSec){
        lastSec = sec;
        if (sec === 30 && total > 30) cue30();
        else if (sec >= 1 && sec <= 10) cueTick(sec);
      }
    }
  }, 200);
}
function stopTick(){ if (tick){ clearInterval(tick); tick = null; } lastSec = null; }

/* 도전 1회 소진 (02·03·04) */
function useTry(auto){
  if (!auto) snap();
  S.triesLeft -= 1;
  if (S.triesLeft <= 0){ doFail(); return; }
  stopTick();
  S.armed = false;               // 출발 지점으로 돌아갈 시간을 준다
  S.endsAt = null;
  buzz(60); save(); renderRun();
}

/* ══════════════════ 통과 / 실패 ══════════════════ */
function doPass(){
  snap(); stopTick();
  if (S.idx === MISSIONS.length - 1){ S.phase = "done"; save(); renderDone(); return; }
  enter(S.idx + 1); save(); toBrief();
}

function doFail(){
  stopTick();
  const m = M();
  const bi = MISSIONS.findIndex(x => x.id === m.back);
  const bm = MISSIONS[bi];

  const before = tierOf(bm);     // 복귀 대상이 지금 몇 단계인지
  enter(bi);                     // 되돌아가는 것도 한 회차다
  const after = tierOf(bm);

  S.phase = "fail"; S.endsAt = null; S.armed = false; save();

  $("ov-to").textContent = (m.back === m.id ? m.id + " " + m.name + " 처음부터" : bm.id + " " + bm.name + "부터");
  $("ov-sub").textContent = S.att[bm.id] + "회차로 다시 시작합니다";
  $("ov").classList.remove("hide");
  buzz([250,120,250]);

  const ez = $("ov-ease");
  if (after > before){
    ez.className = "ease" + (after === 2 ? " t2" : "");
    ez.innerHTML = "<div class='h'>⚑ " + bm.id + " " + bm.name + " · " + TIER_NAME[after] + "</div>" +
                   "<div class='c'>" + bm.cond[after] + "</div>";
  } else {
    ez.className = "ease hide";
  }
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function renderDone(){
  const mins = Math.round((Date.now() - S.startedAt) / 60000);
  $("d-lead").textContent = (S.team ? S.team + " · " : "") + "08번까지 완주했습니다. 총 " + mins + "분.";
  const sum = $("d-sum"); sum.innerHTML = "";
  MISSIONS.forEach(m => {
    const r = document.createElement("div"); r.className = "r";
    r.innerHTML = "<span>" + m.id + " " + m.name + "</span><b>" + (S.att[m.id] || 0) + "회차</b>";
    sum.appendChild(r);
  });
  show("s-done");
}

/* ══════════════════ 조작 ══════════════════ */
$("btn-new").onclick = () => {
  S = { team: $("team").value.trim(), idx: 0, phase: "brief", att: {}, endsAt: null, triesLeft: null, armed: false, startedAt: Date.now() };
  MISSIONS.forEach(m => S.att[m.id] = 0);
  enter(0);
  prev = null; save(); toBrief();
};
$("btn-resume").onclick = () => {
  S = load(); prev = null;
  if (!S) return;
  if (S.phase === "done") renderDone();
  else if (S.phase === "fail"){ S.phase = "brief"; toBrief(); }
  else if (S.phase === "run"){ renderRun(); startTick(); keepAwake(); }
  else toBrief();
};
$("b-start").onclick = startRun;
$("r-go").onclick = () => { snap(); armTry(); };
$("r-pass").onclick = doPass;
$("r-fail").onclick = () => {
  const m = M();
  if (m.tries){ useTry(false); return; }
  if (confirm("실패로 처리할까요?\n→ " + backLabel(m))) { snap(); doFail(); }
};
$("ov-ok").onclick = () => { $("ov").classList.add("hide"); toBrief(); };
$("d-reset").onclick = () => { wipe(); S = null; prev = null; show("s-start"); };
$("b-undo").onclick = $("r-undo").onclick = () => {
  if (!prev) return;
  if (!confirm("직전 상태로 되돌릴까요?\n실패·통과 판정이 취소됩니다.")) return;
  S = prev; prev = null; stopTick(); save();
  if (S.phase === "run"){ renderRun(); startTick(); } else toBrief();
};

/* 시작 시 복구 제안 */
(function init(){
  const old = load();
  if (old && old.phase !== "done"){
    $("btn-resume").classList.remove("hide");
    $("btn-new").classList.add("ghost");
    $("btn-new").textContent = "새로 시작 (기록 삭제)";
  }
  show("s-start");
})();
</script>
</body>
</html>
